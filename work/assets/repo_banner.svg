<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101429" />
      <stop offset="50%" stop-color="#181D38" />
      <stop offset="100%" stop-color="#0B0E1A" />
    </linearGradient>

    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06BBCC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0596a5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06BBCC" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .heading { font-family: 'Nunito', -apple-system, sans-serif; font-weight: 800; }
    .sub { font-family: 'Heebo', -apple-system, sans-serif; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="80" r="140" fill="#06BBCC" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="150" cy="280" r="160" fill="#10B981" opacity="0.08" filter="url(#glowFilter)" />

  <!-- Decorative Tech Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Top Eyebrow Badge -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="460" height="32" rx="16" fill="rgba(6, 187, 204, 0.12)" stroke="#06BBCC" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10B981" />
    <text x="32" y="21" fill="#06BBCC" class="mono" font-size="12" font-weight="600" letter-spacing="1.5">FLYRANK APPLIED ML INTERNSHIP · CAPSTONE ML-CAP-01</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="132" fill="#FFFFFF" class="heading" font-size="38" letter-spacing="-0.5">
    Search Refresh &amp; Content Opportunity Scoring
  </text>
  <text x="60" y="172" fill="#94A3B8" class="sub" font-size="18" font-weight="400">
    A leak-free offline action engine prioritizing high-upside content refreshes across 30,000 enterprise search URLs.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 215)">
    <!-- Badge 1: Precision@50 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(6, 187, 204, 0.3)" stroke-width="1.2" />
      <text x="20" y="42" fill="#06BBCC" class="heading" font-size="32" font-weight="900">0.740</text>
      <text x="20" y="66" fill="#FFFFFF" class="heading" font-size="13" font-weight="700">Precision@50 (Held-Out)</text>
      <text x="20" y="82" fill="#94A3B8" class="mono" font-size="11">Random Forest Champion</text>
    </g>

    <!-- Badge 2: Multiplicative Lift -->
    <g transform="translate(260, 0)">
      <rect width="240" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(6, 187, 204, 0.3)" stroke-width="1.2" />
      <text x="20" y="42" fill="#34D399" class="heading" font-size="32" font-weight="900">3.08×</text>
      <text x="20" y="66" fill="#FFFFFF" class="heading" font-size="13" font-weight="700">Baseline Multiplier Lift</text>
      <text x="20" y="82" fill="#94A3B8" class="mono" font-size="11">vs. 0.240 Rule Baseline</text>
    </g>

    <!-- Badge 3: Dataset Scale -->
    <g transform="translate(520, 0)">
      <rect width="240" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(6, 187, 204, 0.3)" stroke-width="1.2" />
      <text x="20" y="42" fill="#FFFFFF" class="heading" font-size="32" font-weight="900">30,000</text>
      <text x="20" y="66" fill="#FFFFFF" class="heading" font-size="13" font-weight="700">Enterprise URLs Scored</text>
      <text x="20" y="82" fill="#94A3B8" class="mono" font-size="11">120 Client Domains</text>
    </g>

    <!-- Badge 4: Leakage Zero -->
    <g transform="translate(780, 0)">
      <rect width="280" height="96" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />
      <text x="20" y="42" fill="#10B981" class="heading" font-size="32" font-weight="900">0.0%</text>
      <text x="20" y="66" fill="#FFFFFF" class="heading" font-size="13" font-weight="700">Target Feature Leakage</text>
      <text x="20" y="82" fill="#94A3B8" class="mono" font-size="11">GroupShuffleSplit on client_id</text>
    </g>
  </g>

  <!-- Decorative Outer Border Accent -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
